name: Build Animatedban

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Paper 1.21.11 Plugin

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build plugin
        run: |
          gradle clean build --no-daemon --stacktrace

      - name: List build output
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -lah build/libs/

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Animatedban-Paper-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
