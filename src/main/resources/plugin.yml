name: Animatedban
version: 1.1.0
main: id.animatedban.AnimatedBanPlugin
api-version: '1.21'
description: Cinematic animated ban hammer for Paper 1.21.11 with impact debris and post-ban effects
author: KingBrezz

commands:
  banhammer:
    description: Ban a player with the Animatedban cinematic.
    usage: /banhammer <player> [reason]
    permission: animatedban.use

  bn:
    description: Test Animatedban animation without banning.
    usage: /bn test <player>
    permission: animatedban.use

permissions:
  animatedban.use:
    description: Allows using Animatedban commands.
    default: op
  animatedban.bypass:
    description: Prevents a player from being targeted.
    default: false
